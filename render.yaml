services:
  - type: web
    name: smart-attendance-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_NAME
        value: School Admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
